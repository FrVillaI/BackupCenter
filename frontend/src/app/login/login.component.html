<!-- login.component.html -->

<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-logo">
      <span class="login-logo-dot"></span>
    </div>
    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">Acceso al sistema de respaldo</p>
    <div class="login-divider"></div>

    <!-- Form -->
    <form (ngSubmit)="login(formulario)" #formulario="ngForm">

      <div class="login-form-group">
        <label for="username" class="login-label">Nombre de Usuario</label>
        <input
          id="username"
          type="text"
          class="login-input"
          placeholder="Usuario"
          name="username"
          [(ngModel)]="username"
        />
      </div>

      <div class="login-form-group">
        <label for="password" class="login-label">Contraseña</label>
        <div class="login-password-group">
          <input
            id="password"
            [type]="passwordFieldType"
            class="login-input"
            placeholder="••••••••"
            name="password"
            [(ngModel)]="password"
          />
          <button
            type="button"
            class="login-toggle-btn"
            (click)="togglePasswordVisibility()"
          >
            {{ passwordFieldType === 'password' ? 'Mostrar' : 'Ocultar' }}
          </button>
        </div>
      </div>

      <button type="submit" class="login-submit">
        Ingresar
      </button>

    </form>

  </div>
</div>
